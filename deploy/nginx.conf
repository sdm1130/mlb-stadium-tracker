# nginx config for the stadium tracker container (replaces the image's
# default.conf). Plain static files; all data lives in the browser and Firebase.
server {
    listen 80;
    # Also IPv6: inside the container "localhost" resolves to ::1, which is
    # what Coolify's health check (wget/curl http://localhost/) connects to.
    listen [::]:80;
    server_name stadiumtracker.stevenmurphy.net;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Never serve dotfiles (.git, .dockerignore, ...) even if they slip into the image.
    location ~ /\. {
        deny all;
    }
}
